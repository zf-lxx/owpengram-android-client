name: Build APK

# Builds a signed, installable APK for this fork. The project needs a matching
# NDK (27.2.12479018), several GB of SDK packages and a JVM, so CI is a far
# cheaper way to produce a build than a local toolchain.
#
# Signing key: the project gitignores TMessagesProj/config/release.keystore, so
# the keystore is stored base64-encoded in the repository secret
# OWPENGRAM_KEYSTORE_B64 and restored before the build. Keeping it out of the
# tree also keeps it out of forks. Passwords are the project defaults
# ("android" / alias "androidkey"), set in gradle.properties.
#
# This is NOT the upstream OwpenGram key, so the first install must replace the
# original app (uninstall, then install). Later builds install over each other.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.OWPENGRAM_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret OWPENGRAM_KEYSTORE_B64 is not set" >&2
            exit 1
          fi
          mkdir -p TMessagesProj/config
          printf '%s' "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          test -s TMessagesProj/config/release.keystore

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_App/build/outputs -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-selfhosted-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
